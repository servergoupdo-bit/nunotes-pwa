<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NuNotes._</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Proyectos → Tareas → Acciones">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
            color: #17221f;
            background: #f2f5f2;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 0;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(ellipse at 50% 0%, #ffffff 0, #f2f5f2 68%);
        }

        main {
            width: min(100%, 440px);
            text-align: center;
        }

        .logo {
            display: block;
            width: 96px;
            height: auto;
            max-width: 100%;
            margin: 0 auto 24px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 36px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 1.1;
        }

        header p {
            margin: 0;
            color: #52635c;
        }

        .launcher {
            width: 100%;
            min-height: 56px;
            border: 0;
            border-radius: 6px;
            padding: 14px 20px;
            background: #176b53;
            color: #fff;
            font: inherit;
            font-size: 17px;
            font-weight: 650;
            cursor: default;
        }

        .launcher:disabled {
            background: #526b62;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <main>
        <header>
            <img class="logo" src="icon-192.png" alt="" width="192" height="192">
            <h1>NuNotes._</h1>
            <p>Proyectos → Tareas → Acciones</p>
        </header>

        <button class="launcher" id="open-nunotes" type="button" disabled>Abrir NuNotes._</button>
    </main>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>
</body>
</html>
